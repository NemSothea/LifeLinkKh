name: lifelink_kh
description: "LifeLink KH (ជីវិត) — blood donor matching app for Cambodia."
# Never published to pub.dev — this is an application, not a package.
publish_to: 'none'

# versionName / versionCode for the Play Store. Bump before each M7 upload.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Architecture choices recorded in docs/tech-lead/adr/0006-flutter-course-architecture.md.
  #
  # Riverpod 2.x, not 3.x. Two reasons, and the second is the hard one: the course
  # prescribes 2.x (Week 4), and riverpod_generator cannot be solved against
  # flutter_riverpod 3.x on Flutter 3.44.6 — the generator needs matcher <0.12.19
  # and this SDK's flutter_test pins 0.12.19 exactly. Code generation is a Week 4
  # requirement, so the runtime moved to meet it.
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^17.4.0
  dio: ^5.11.0

  # flutter_localizations pins intl from the SDK, so this constraint has to contain
  # whatever the SDK asks for: 0.20.2 on Flutter 3.44.6, ^0.20.3 on newer stables. A caret
  # resolves to exactly 0.20.2 here and still solves on a newer SDK; the old exact pin did
  # not, and broke CI the day stable moved.
  intl: ^0.20.2
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  google_sign_in: ^7.2.0
  # FR-AUTH-004: Facebook login dialog only — Firebase Auth handles the federated
  # provider server-side, same as Google, so no extra backend dependency.
  flutter_facebook_auth: ^7.1.1
  # FR-AUTH-004: opens the https://t.me/<bot>?start=... deep link that hands the donor
  # to the Telegram app.
  url_launcher: ^6.3.1
  firebase_messaging: ^16.5.0
  flutter_secure_storage: ^10.0.0
  google_fonts: ^8.2.1
  # M6 (root CLAUDE.md §4): FR-DONOR-001's "use my current location" button. Coordinates only —
  # no google_maps_flutter, no map widget (DEC-004).
  geolocator: ^14.0.2
  # FR-GLOBAL-001's mobile half: the in-app language choice has to survive a restart,
  # and it is a preference, not a credential — flutter_secure_storage (the Keystore /
  # Keychain, used for the session JWT) would be the wrong store for it.
  shared_preferences: ^2.5.5
  drift: ^2.22.0
  # 0.5.x, deliberately NOT ^0.6.0+eol. Version 0.6.0 is an empty package — it exists only to
  # assert that the old Flutter build scripts are gone, and it is meant for apps that have moved
  # to sqlite3 3.x. Drift 2.28 still resolves sqlite3 2.9.x here, which gets its native library
  # from THIS package, so 0.6.0 silently ships an APK with no libsqlite3.so. The app then builds,
  # installs, signs in, and throws the first time a donor with a profile opens Home:
  #   Failed to load dynamic library '.../lib/libsqlite3.so': dlopen failed
  # Found on a real device 2026-09-24. Host tests never see it — macOS has a system SQLite.
  sqlite3_flutter_libs: ^0.5.41
  connectivity_plus: ^7.3.1
  path_provider: ^2.1.6
  path: ^1.9.1
  # Native launch screen (generated config below) plus preserve()/remove(), which hold it
  # until the session restore resolves — so a cold start is one branded screen, not
  # white → badge → destination.
  flutter_native_splash: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Turns @riverpod annotations into *.g.dart provider plumbing.
  # Dev loop: dart run build_runner watch -d
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.13

  # Generates the launcher icons for both platforms from assets/branding/.
  # Dev-only: it is a one-shot generator, not something the app links against.
  # Re-run after editing the source art:
  #   dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.4
  drift_dev: ^2.22.0

  # custom_lint + riverpod_lint are deliberately absent. The course lists them as
  # recommended rather than required (Week 4), and they cannot be solved on this
  # Flutter SDK — custom_lint pulls an analyzer that wants the removed `_macros`
  # SDK package. Revisit when the toolchain moves.

flutter:
  uses-material-design: true
  # Generates lib/l10n/app_localizations.dart from the ARB files (see l10n.yaml).
  generate: true
  assets:
    # google_fonts loads these instead of fetching from fonts.gstatic.com. A donor with no
    # signal would otherwise get the platform fallback — tofu boxes for Khmer — and the
    # golden tests would render a different font on Linux CI than on macOS.
    # See assets/google_fonts/README.md; the filenames are load-bearing.
    - assets/google_fonts/

# Launcher icons, generated from the same mark the sign-in screen draws
# (Icons.bloodtype on AppTheme._seed). See assets/branding/README.md for why the
# artwork is committed rather than produced at build time.
flutter_launcher_icons:
  image_path: assets/branding/icon.png

  android: true
  # Legacy bitmap for pre-Android 8, and the adaptive pair for everything since.
  # Without the adaptive layers the launcher masks the square bitmap itself,
  # which on a round-mask launcher crops the droplet.
  image_path_android: assets/branding/icon-round.png
  adaptive_icon_background: assets/branding/icon-adaptive-background.png
  adaptive_icon_foreground: assets/branding/icon-adaptive-foreground.png

  ios: true
  # The App Store rejects an icon with an alpha channel; the source is opaque.
  remove_alpha_ios: true

# Native launch screen — what shows before Flutter draws anything (Firebase init, the
# SharedPreferences load), which used to be `flutter create`'s blank white window.
# The art is rendered from `BrandBadge` itself and the colours are the theme's own
# `surface`, so the hand-off to Flutter's first frame has no seam. Regenerate after
# changing either (see assets/branding/README.md):
#   flutter test tool/render_splash_art.dart
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFF8F7"          # AppTheme.light colorScheme.surface
  color_dark: "#1A1110"     # AppTheme.dark colorScheme.surface
  image: assets/branding/splash.png
  image_dark: assets/branding/splash-dark.png

  # Android 12+ ignores the images above: the OS draws the launcher icon in a circle
  # itself. Same droplet, same red, on the same surface.
  android_12:
    image: assets/branding/icon-adaptive-foreground.png
    icon_background_color: "#C62828"
    image_dark: assets/branding/icon-adaptive-foreground.png
    icon_background_color_dark: "#D15353"
    color: "#FFF8F7"
    color_dark: "#1A1110"

  android: true
  ios: true
  web: false
  # A splash is not the place to hide the clock: the status bar stays visible, as it
  # does on every screen after it.
  fullscreen: false
