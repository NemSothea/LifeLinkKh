name: lifelink_kh
description: "LifeLink KH (ជីវិត) — blood donor matching app for Cambodia."
# Never published to pub.dev — this is an application, not a package.
publish_to: 'none'

# versionName / versionCode for the Play Store. Bump before each M7 upload.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Architecture choices recorded in docs/tech-lead/adr/0006-flutter-course-architecture.md.
  #
  # Riverpod 2.x, not 3.x. Two reasons, and the second is the hard one: the course
  # prescribes 2.x (Week 4), and riverpod_generator cannot be solved against
  # flutter_riverpod 3.x on Flutter 3.44.6 — the generator needs matcher <0.12.19
  # and this SDK's flutter_test pins 0.12.19 exactly. Code generation is a Week 4
  # requirement, so the runtime moved to meet it.
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^17.4.0
  dio: ^5.11.0

  # Pinned exactly: flutter_localizations from the SDK depends on intl 0.20.2, so a
  # caret range above that makes version solving fail outright.
  intl: 0.20.2
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  google_sign_in: ^7.2.0
  # FR-AUTH-004: Facebook login dialog only — Firebase Auth handles the federated
  # provider server-side, same as Google, so no extra backend dependency.
  flutter_facebook_auth: ^7.1.1
  # FR-AUTH-004: opens the https://t.me/<bot>?start=... deep link that hands the donor
  # to the Telegram app.
  url_launcher: ^6.3.1
  firebase_messaging: ^16.5.0
  flutter_secure_storage: ^10.0.0
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Turns @riverpod annotations into *.g.dart provider plumbing.
  # Dev loop: dart run build_runner watch -d
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.13

  # custom_lint + riverpod_lint are deliberately absent. The course lists them as
  # recommended rather than required (Week 4), and they cannot be solved on this
  # Flutter SDK — custom_lint pulls an analyzer that wants the removed `_macros`
  # SDK package. Revisit when the toolchain moves.

flutter:
  uses-material-design: true
  # Generates lib/l10n/app_localizations.dart from the ARB files (see l10n.yaml).
  generate: true
