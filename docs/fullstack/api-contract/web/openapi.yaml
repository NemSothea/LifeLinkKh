openapi: 3.1.0
info:
  title: LifeLink KH — Web API
  version: 0.4.0
  description: |
    Hospital portal (Next.js). Machine twin of contract.md — this file wins on conflict.

    FR-PORTAL-001 is still the DEC-004 trim: one page of open requests plus
    confirm-donation. FR-PORTAL-002 (admin dashboard) is still deferred, so there is no
    metrics endpoint here. What grew since 0.2.0 is everything around that page:

    * **A public board.** GET /public/requests is the only unauthenticated read in the
      product — DEC-009 made the request board readable without an account, including
      accepted donors by name. Its own service and DTOs, never the portal's.
    * **Portal sign-in.** POST /auth/portal/login takes a username and password, not a
      Google ID token. ADR 0002 moved *donor* auth to Google because a donor should not
      hold a password; portal staff are named desktop accounts with the opposite need.
      See DEC-010.
    * **Staff lifecycle.** Create, promote, demote, revoke — /admin/*. Before these, the
      only way to add a portal account was writing a Flyway migration.

    Tags: `portal` for the request table, `board` for the public read, `auth` for
    sign-in and password change, `admin` for staff provisioning.
servers:
  - url: http://localhost:8080/api

tags:
  - name: portal
  - name: board
  - name: auth
  - name: admin

paths:
  /health:
    get:
      tags: [portal]
      summary: Liveness check
      description: |
        Unauthenticated. Added at M2 — the compose healthchecks for both `backend` and `web`
        depend on it, and the M2 portal page renders its result to prove the browser →
        Next server → backend container chain end to end.
      security: []
      responses:
        '200':
          description: The API is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, example: UP }

  /public/requests:
    get:
      tags: [board]
      summary: The public live board — every OPEN request
      description: |
        **No authentication.** The only unauthenticated read in this product (DEC-009).

        Deliberately narrower than the portal's own list, and the differences are the
        decision rather than an oversight:
          * OPEN only. A fulfilled or cancelled request is not a call for help.
          * `acceptedDonors` carries no `matchId` — that handle exists to write a donation
            confirmation, and a public page has no business publishing it.
          * No `contactName` or `contactPhone`. Those are revealed only to a donor who
            accepted, and DEC-009 did not change that rule.
          * No coordinates anywhere (ADR 0003).

        Rate limited per IP on its own bucket, so a ward screen refreshing every thirty
        seconds cannot lock anyone out of signing in.
      responses:
        '200':
          description: Every open request, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PublicRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/portal/login:
    post:
      tags: [auth]
      summary: Portal staff sign-in
      description: |
        Username and password, for HOSPITAL and ADMIN accounts only. Returns the same
        AuthResponse shape the mobile contract's /auth/google does — one session format,
        two ways of obtaining it.

        **Every failure answers an identical 401 `INVALID_CREDENTIALS`**, in the same time:
        unknown username, wrong password, a role that may not use this door, and a revoked
        account. An unknown username is compared against a decoy hash so the response time
        cannot enumerate the staff list either.

        Rate limited per IP on the same bucket as /auth/google.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, maxLength: 64 }
                password: { type: string, maxLength: 200, format: password }
      responses:
        '200':
          description: A session for this staff account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/portal/password:
    post:
      tags: [auth]
      summary: Change your own password
      description: |
        The caller is the JWT subject and there is no user field, so this cannot be pointed
        at anyone else's account — an admin cannot change a staff member's password through
        it, and a staff member cannot change an admin's.

        `currentPassword` is required even though the caller holds a valid session: a
        session proves possession of a browser, not of the password, and this product has
        no reset path to recover from a hijacked one.

        There is no forgot-password endpoint, deliberately. A reset needs a channel to
        prove identity over, and ADR 0002 left this product with neither verified email nor
        verified phone. See docs/demo-runbook.md section 9.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, minLength: 8, maxLength: 200, format: password }
      responses:
        '204': { description: Changed. Sessions already issued stay valid until they expire (ADR 0007) }
        '401':
          description: Wrong current password
        '422':
          description: |
            `PASSWORD_UNCHANGED` — the new password matches the current one, or
            `NO_PASSWORD_LOGIN` — this account signs in through Google or Telegram.
        '429': { $ref: '#/components/responses/RateLimited' }

  /admin/users:
    get:
      tags: [admin]
      summary: Accounts an ADMIN could promote
      description: |
        DONOR and REQUESTER accounts that have signed in at least once, filtered to those
        with a display name — without one there is nothing to tell two candidates apart by,
        and a bare UUID invites picking the wrong person.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Promotable accounts, by name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminCandidate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/staff:
    get:
      tags: [admin]
      summary: Current portal staff
      description: Active HOSPITAL and ADMIN accounts. A revoked account is excluded — its row is kept only so the donations it confirmed still name who confirmed them.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Staff accounts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Staff' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin]
      summary: Promote an existing account to staff
      description: |
        TM-AUTH-001 E1. Promotes a row that already exists; it never creates an identity
        from a typed name, which is the rule S1 closed — a user's identity comes only from
        a credential they proved themselves.

        Not idempotent on purpose: an account that is already staff is refused
        (`ALREADY_STAFF`) rather than re-provisioned by a double click.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, role]
              properties:
                userId: { type: string, format: uuid }
                role: { type: string, enum: [HOSPITAL, ADMIN] }
                hospitalId:
                  type: string
                  format: uuid
                  nullable: true
                  description: Required for HOSPITAL, must be absent for ADMIN.
      responses:
        '200':
          description: The account, now staff
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Staff' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Unknown user or hospital }
        '422':
          description: '`INVALID_ROLE`, `HOSPITAL_ID_REQUIRED`, `HOSPITAL_ID_NOT_ALLOWED` or `ALREADY_STAFF`'

  /admin/staff/accounts:
    post:
      tags: [admin]
      summary: Create a portal account with a username and password
      description: |
        The sibling of POST /admin/staff, for the case promotion cannot serve: a desk-only
        clerk with no mobile account to promote. Before this endpoint the only way to add
        one was writing a Flyway migration.

        This does not reopen TM-AUTH-001 S1. That rule protects *self-service* sign-up —
        nobody may claim to be someone by typing their name. This is an authenticated ADMIN
        provisioning an account they are accountable for, the same trust promotion carries.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, displayName, role]
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 64
                  pattern: '^[a-z0-9._-]+$'
                  description: Lowercase only — it is typed at a sign-in box off a note, and 'Soborey' does not match 'soborey'.
                password: { type: string, minLength: 8, maxLength: 200, format: password }
                displayName: { type: string }
                role: { type: string, enum: [HOSPITAL, ADMIN] }
                hospitalId: { type: string, format: uuid, nullable: true }
      responses:
        '201':
          description: The account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Staff' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: '`USERNAME_TAKEN`, `INVALID_ROLE`, `HOSPITAL_ID_REQUIRED` or `HOSPITAL_ID_NOT_ALLOWED`'

  /admin/staff/{id}/demote:
    post:
      tags: [admin]
      summary: Demote an ADMIN to hospital staff
      description: |
        The only demotion that means anything with two staff roles. A hospital is required,
        because a hospital-scoped account with no hospital is the state POST /admin/staff
        already refuses to create.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hospitalId]
              properties:
                hospitalId: { type: string, format: uuid }
      responses:
        '200':
          description: The account, now hospital staff
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Staff' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Unknown user or hospital }
        '422':
          description: |
            `NOT_AN_ADMIN`, `NOT_STAFF`, `HOSPITAL_ID_REQUIRED`, or one of the two guards:
            `CANNOT_TARGET_SELF` (the page you would undo it from is the page you just
            lost) and `LAST_ADMIN` (with none left, nobody can grant access again).

  /admin/staff/{id}/revoke:
    post:
      tags: [admin]
      summary: Remove portal access
      description: |
        What this does depends on how the account can authenticate:

        * **Promoted** — it still holds a Google or Telegram credential, so it returns to
          DONOR and keeps working as an ordinary mobile account. Nothing is destroyed.
        * **Portal-only** — it has nowhere to go back to, so `users.deactivated_at` is set
          and sign-in refuses it. **The row is never deleted**:
          `donations.confirmed_by_user_id` references it, so deleting either fails on the
          foreign key or erases who confirmed a donation.

        Guarded by `CANNOT_TARGET_SELF` and `LAST_ADMIN`, same as demote.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Access removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Unknown user }
        '422': { description: '`NOT_STAFF`, `CANNOT_TARGET_SELF` or `LAST_ADMIN`' }

  /portal/requests:
    get:
      tags: [portal]
      summary: Open requests table
      description: |
        HOSPITAL sees its own hospital's requests; ADMIN sees all. Scope comes from the JWT,
        never from a query parameter. A DONOR JWT gets 403.

        acceptedDonors lists only donors who accepted — the alerted-but-silent list is 11
        people's blood type and district for no operational reason (TM-AUTH-001 I1).
        No latitude, longitude, or distance appears anywhere in this response (ADR 0003).
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [OPEN, FULFILLED, CANCELLED]
            default: OPEN
      responses:
        '200':
          description: Requests visible to this caller
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PortalRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /portal/requests/{id}/confirm-donation:
    post:
      tags: [portal]
      summary: Record a donation against a request
      description: |
        The only write path to `donations` in the whole product. FR-DONATION-001 (donor
        history) and FR-DONOR-002 (56-day cooldown) both read from it — skip this at M5 and
        the history screen is permanently empty and every donor stays eligible forever.

        One transaction, three effects:
          1. insert donations (donor, hospital, request, donatedOn, confirmedBy)
          2. update donor_profiles.last_donation_date — it caches MAX(donations.donated_on)
             and must not drift from the row just written
          3. set blood_requests.status = FULFILLED once unitsNeeded is met

        matchId must belong to this request and be ACCEPTED. Confirming a donation from a
        donor who never accepted would silently start their 56-day cooldown.
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [matchId, donatedOn]
              properties:
                matchId: { type: string, format: uuid }
                donatedOn:
                  type: string
                  format: date
                  description: Must not be in the future.
      responses:
        '201':
          description: Donation recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DonationConfirmation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Unknown request, or not visible to this caller }
        '409': { description: Match already confirmed, or request already closed }
        '422':
          description: matchId not ACCEPTED or not on this request; donatedOn in the future
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Malformed body or bad enum value
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing, invalid, or expired JWT
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated but not HOSPITAL or ADMIN
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

    RateLimited:
      description: Too many requests from this IP. `RATE_LIMITED`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    BloodType:
      type: string
      enum: ['O-', 'O+', 'A-', 'A+', 'B-', 'B+', 'AB-', 'AB+']

    Urgency:
      type: string
      enum: [CRITICAL, URGENT, ROUTINE]

    RequestStatus:
      type: string
      description: EXPIRED is unreachable in this build — FR-REQUEST-005 deferred (DEC-004).
      enum: [OPEN, FULFILLED, CANCELLED]

    DistrictName:
      type: object
      description: |
        Both labels, never one. The portal switches locale at runtime, so picking a language
        server-side would show a district in the language the reader just left. Same shape and
        same reasoning as the mobile contract's DistrictName (CR-MAPI-001).
      required: [km, en]
      properties:
        km: { type: string, example: ដូនពេញ }
        en: { type: string, example: Doun Penh }

    Hospital:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Calmette Hospital }
        districtName:
          allOf: [{ $ref: '#/components/schemas/DistrictName' }]
          nullable: true
          description: Null for a hospital with no district code. Was undocumented here until 0.4.0, though the API has always sent it.

    AcceptedDonor:
      type: object
      description: |
        Only donors whose match response is ACCEPTED. No phone number here — staff coordinate
        through the requester, and no coordinates ever (ADR 0003).
      required: [matchId, displayName, bloodType, respondedAt]
      properties:
        matchId: { type: string, format: uuid }
        displayName: { type: string }
        bloodType: { $ref: '#/components/schemas/BloodType' }
        districtName:
          allOf: [{ $ref: '#/components/schemas/DistrictName' }]
          nullable: true
          description: |
            A pair since 0.4.0 (BUG-API-004). It was a bare English string, which left the Khmer
            board printing one Latin place name per card, directly under a Khmer one.
        respondedAt: { type: string, format: date-time }

    PublicDonor:
      type: object
      description: |
        A donor who accepted, as the **public** board shows them (DEC-009). Deliberately not
        AcceptedDonor: that record carries `matchId`, the handle confirm-donation writes
        against, and a public page has no reason to publish it.
      required: [displayName, bloodType, respondedAt]
      properties:
        displayName: { type: string }
        bloodType: { $ref: '#/components/schemas/BloodType' }
        districtName:
          allOf: [{ $ref: '#/components/schemas/DistrictName' }]
          nullable: true
          description: A pair since 0.4.0 (BUG-API-004), matching AcceptedDonor and Hospital.
        respondedAt: { type: string, format: date-time }

    PublicRequest:
      type: object
      description: |
        A row of the public board. Same counts as PortalRequest, computed the same way —
        a number that differs between the public page and the staff page is worse than no
        number. What is absent is the point: no requester contact, no coordinates, no
        `matchId`.
      required: [id, patientBloodType, unitsNeeded, urgency, status, alertedCount, acceptedCount, createdAt, acceptedDonors]
      properties:
        id: { type: string, format: uuid }
        patientBloodType: { $ref: '#/components/schemas/BloodType' }
        unitsNeeded: { type: integer, minimum: 1 }
        urgency: { $ref: '#/components/schemas/Urgency' }
        status: { $ref: '#/components/schemas/RequestStatus' }
        hospital: { $ref: '#/components/schemas/Hospital' }
        alertedCount: { type: integer }
        acceptedCount: { type: integer }
        createdAt: { type: string, format: date-time }
        acceptedDonors:
          type: array
          items: { $ref: '#/components/schemas/PublicDonor' }

    AuthResponse:
      type: object
      description: The same session shape POST /auth/google returns in the mobile contract — one session format, two ways of obtaining it.
      required: [token, user]
      properties:
        token:
          type: string
          description: Session JWT, one hour, no refresh (ADR 0007). The portal keeps it in an httpOnly cookie the browser cannot read.
        user:
          type: object
          required: [id, role]
          properties:
            id: { type: string, format: uuid }
            role: { type: string, enum: [HOSPITAL, ADMIN] }
            displayName: { type: string, nullable: true }
            isNewAccount: { type: boolean }

    AdminCandidate:
      type: object
      description: A DONOR or REQUESTER an ADMIN could promote.
      required: [id, displayName, role]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        role: { type: string, enum: [DONOR, REQUESTER] }

    Staff:
      type: object
      description: A HOSPITAL or ADMIN account as the staff screen lists it.
      required: [id, role]
      properties:
        id: { type: string, format: uuid }
        displayName:
          type: string
          nullable: true
          description: Null for an account seeded before display_name existed that has never signed in.
        role: { type: string, enum: [HOSPITAL, ADMIN] }
        hospitalId: { type: string, format: uuid, nullable: true }
        hospitalName: { type: string, nullable: true }

    PortalRequest:
      type: object
      required: [id, patientBloodType, unitsNeeded, urgency, status, hospital, alertedCount, acceptedCount, createdAt]
      properties:
        id: { type: string, format: uuid }
        patientBloodType: { $ref: '#/components/schemas/BloodType' }
        unitsNeeded: { type: integer }
        urgency: { $ref: '#/components/schemas/Urgency' }
        status: { $ref: '#/components/schemas/RequestStatus' }
        hospital: { $ref: '#/components/schemas/Hospital' }
        alertedCount: { type: integer }
        acceptedCount: { type: integer }
        createdAt: { type: string, format: date-time }
        acceptedDonors:
          type: array
          items: { $ref: '#/components/schemas/AcceptedDonor' }

    DonationConfirmation:
      type: object
      required: [id, donorDisplayName, donatedOn, requestStatus]
      properties:
        id: { type: string, format: uuid }
        donorDisplayName: { type: string }
        donatedOn: { type: string, format: date }
        requestStatus: { $ref: '#/components/schemas/RequestStatus' }
        donorNextEligibleOn:
          type: string
          format: date
          description: |
            donatedOn + 56 days. Returned so staff can tell the donor when to come back —
            the thing the donor actually wants to know at that moment.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: MATCH_NOT_ACCEPTED }
            message: { type: string }

security:
  - bearerAuth: []
