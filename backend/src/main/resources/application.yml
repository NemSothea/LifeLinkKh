spring:
  application:
    name: lifelink-api

  datasource:
    # No credential literals in committed files. docker-compose supplies these
    # under the standard Spring names (infra-docker.md); the default URL is for
    # running the backend outside compose against a local Postgres.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lifelink}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate never generates it — boot fails if
      # entities and migrations disagree.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

lifelink:
  # No defaults on the three below, following the same rule as the datasource
  # credentials above: the value must be supplied by the environment, and a
  # missing one fails startup. A development default is a control that silently
  # disables itself in the environment where it matters.
  firebase:
    project-id: ${FIREBASE_PROJECT_ID}
  jwt:
    secret: ${JWT_SECRET}
    # One hour, and that is now the decision rather than a placeholder: ADR 0007.
    # Expiry is repaired client-side — the Flutter app re-authenticates silently
    # through Firebase on a 401 and retries once. There is no refresh token and no
    # revocation list, so this value IS the blast radius of a leaked JWT.
    lifetime: ${JWT_LIFETIME:PT1H}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  auth:
    rate-limit:
      max-attempts: ${AUTH_RATE_LIMIT_MAX_ATTEMPTS:20}
      window: ${AUTH_RATE_LIMIT_WINDOW:PT1M}
  telegram:
    # All three blank by default, unlike the datasource credentials above — the bot does not exist
    # yet (FR-AUTH-004). TelegramConfig.isAvailable() is false until all three are set, and every
    # /auth/telegram/* endpoint answers 503 TELEGRAM_PROVIDER_UNCONFIGURED until then, the same
    # shape FirebaseConfig already uses for POST /auth/google.
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}
    bot-username: ${TELEGRAM_BOT_USERNAME:}
    rate-limit:
      start:
        max-attempts: ${TELEGRAM_START_RATE_LIMIT_MAX_ATTEMPTS:10}
        window: ${TELEGRAM_START_RATE_LIMIT_WINDOW:PT10M}
      verify:
        # Tighter than start: this is the endpoint TM-AUTH-002 S3 (OTP brute force) actually runs
        # against. The per-challenge attempt_count cap is the real defence; this is depth.
        max-attempts: ${TELEGRAM_VERIFY_RATE_LIMIT_MAX_ATTEMPTS:20}
        window: ${TELEGRAM_VERIFY_RATE_LIMIT_WINDOW:PT10M}
  matching:
    # 25, and the number is a decision with reasoning behind it: ADR 0008. Clearing
    # the PRD's "70% of requests answered within 60 minutes" needs 24 notified donors
    # if only 5% of them accept, and we have no measured acceptance rate yet. It is a
    # ceiling, never a target — a request with 8 candidates alerts 8.
    max-notified: ${MATCHING_MAX_NOTIFIED:25}
    # prd.md FR-05. A donor with no coordinates is matched regardless and ranks last.
    radius-km: ${MATCHING_RADIUS_KM:10}
  request:
    rate-limit:
      # One request fans out to 25 push notifications, so this bounds a user the way
      # max-notified bounds a request. Same reasoning, different axis.
      max-attempts: ${REQUEST_RATE_LIMIT_MAX_ATTEMPTS:5}
      window: ${REQUEST_RATE_LIMIT_WINDOW:PT10M}

server:
  servlet:
    context-path: /api

logging:
  level:
    org.flywaydb: info
