# Owned by Tech Lead. There is no DevOps role.
#
# Three jobs, one per part of the product (ADR 0009): firebase (rules, plus the portal's server
# functions — ADR 0010 — because this is the job with the emulators), web (the Next.js portal)
# and mobile (Flutter). scripts/verify-all.sh runs the same steps locally.
name: ci
on:
  push: { branches: [ main ] }
  pull_request: {}

jobs:
  # ADR 0009: the backend is Firebase. The Security Rules and the portal's server functions
  # (ADR 0010, frontend/src/server) are tested against the Firestore and Auth emulators, which
  # are a Java program — hence setup-java.
  firebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
      - uses: actions/setup-node@v4
        with:
          # 22, what Vercel runs the portal's server on.
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            firebase/package-lock.json
            frontend/package-lock.json
      # `npm install`, not `npm ci`, for the reason given in the web job: the lockfiles are
      # generated on macOS and omit Linux-only optional packages.
      - working-directory: firebase
        run: npm install --no-audit --no-fund
      - working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: firestore rules
        working-directory: firebase
        run: npm run test:rules
      - name: server functions, unit
        working-directory: frontend
        run: npm run test:server
      - name: server functions against the emulators
        working-directory: frontend
        run: npm run test:server:emulator

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check whether frontend/ is scaffolded
        id: scaffolded
        run: |
          if [ -f frontend/package.json ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
            echo "::notice::frontend/ not scaffolded yet (M2 step 3) — nothing to check."
          fi
      - uses: actions/setup-node@v4
        if: steps.scaffolded.outputs.yes == 'true'
        with:
          # 22. Node 20 trips EBADENGINE on deps that require >=22.
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.scaffolded.outputs.yes == 'true'
        working-directory: frontend
        # `npm ci` and not `npm install` would be the stricter choice, but the lockfile
        # is generated on macOS arm64 and npm omits the Linux-only optional packages
        # (@emnapi/*, @swc/helpers) that a Linux runner then demands. `npm ci` fails on
        # that mismatch. Revisit if npm fixes cross-platform optional resolution.
        run: npm install --no-audit --no-fund
      - if: steps.scaffolded.outputs.yes == 'true'
        working-directory: frontend
        run: npm run lint
      - if: steps.scaffolded.outputs.yes == 'true'
        working-directory: frontend
        run: npx tsc --noEmit
      - if: steps.scaffolded.outputs.yes == 'true'
        working-directory: frontend
        run: npm test -- --run

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check whether mobile/ is scaffolded
        id: scaffolded
        run: |
          if [ -f mobile/pubspec.yaml ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
            echo "::notice::mobile/ not scaffolded yet (M2 step 4) — nothing to check."
          fi
      # Pinned, not `channel: stable`. An unpinned stable moved under us and broke
      # `flutter pub get` for two days — the SDK's own flutter_localizations started
      # requiring a newer intl than the app pins. CI has to run the version the Android
      # release is built with, or a green CI says nothing about the artifact we ship.
      - uses: subosito/flutter-action@v2
        if: steps.scaffolded.outputs.yes == 'true'
        with:
          flutter-version: 3.44.6
          channel: stable
      - if: steps.scaffolded.outputs.yes == 'true'
        working-directory: mobile
        run: flutter pub get
      - if: steps.scaffolded.outputs.yes == 'true'
        working-directory: mobile
        run: flutter analyze
      # Goldens excluded: they compare PNGs captured on macOS, and the Linux runner
      # antialiases text differently even with the fonts bundled. Flutter only guarantees
      # golden equality on the capture platform. Everything else runs.
      - if: steps.scaffolded.outputs.yes == 'true'
        working-directory: mobile
        run: flutter test --exclude-tags golden

  # The signed AAB build lands at M7 and needs the upload keystore in repository
  # secrets plus a written deploy runbook. Neither exists — docs/risks.md.
