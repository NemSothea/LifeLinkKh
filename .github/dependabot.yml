# SEC-REVIEW-003 F-09: known-vulnerable dependencies are found by a bot, not by a review months
# later. Security updates open at once; version updates weekly, grouped so they do not drown
# the queue. The remediation windows (critical 7 days, high 30) are in
# docs/security/security-checklist.md §Dependencies.
#
# Major versions are ignored for the four package ecosystems (2026-10-27): each one is a
# migration, not a bump, and they were piling up unreviewed. Raise a major by hand when the
# migration is planned; security updates still open regardless of this ignore.
#
# Dependabot reads this file from the default branch only, which on GitHub is now
# feat/firebase-backend; `target-branch` keeps it there if the default changes back to main.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    target-branch: feat/firebase-backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    # @types/node follows the runtime (engines 22.x), not the newest Node: a major bump would type
    # APIs that Vercel's Node 22 does not have. Raise it by hand with the engines field.
    ignore:
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      - dependency-name: '*'
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /firebase
    target-branch: feat/firebase-backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
  # The handbook's build tooling. Monthly: it ships static pages, and a stale minor version there
  # costs nothing; security updates still open at once.
  - package-ecosystem: npm
    directory: /docs/book
    target-branch: feat/firebase-backend
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
  - package-ecosystem: pub
    directory: /mobile
    target-branch: feat/firebase-backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    # flutter_localizations pins intl to the exact version the Flutter SDK ships, so any newer
    # intl fails version solving. It moves when the pinned Flutter in CI moves, by hand.
    #
    # The '*' major ignore below did not hold for pub inside a group: PR #60 (2026-11-03) still
    # carried flutter_riverpod 2→3 and riverpod_generator 2→4. So the risky ones are named:
    # - build_runner / drift_dev / riverpod_generator pull a newer analyzer, which needs a newer
    #   Dart SDK than the pinned Flutter ships (build_runner 2.16.2 failed version solving against
    #   flutter_test's meta pin). Move them by hand with the pinned Flutter.
    # - drift moves together with drift_dev.
    # - riverpod runtime majors are a migration plus a full codegen rebuild.
    # - sqlite3_flutter_libs 0.6.0+eol is an empty package; on Drift 2.28 it drops the native
    #   library and the app crashes on device (see the comment in mobile/pubspec.yaml).
    ignore:
      - dependency-name: intl
      - dependency-name: build_runner
      - dependency-name: drift
      - dependency-name: drift_dev
      - dependency-name: riverpod_generator
      - dependency-name: flutter_riverpod
        update-types: [version-update:semver-major]
      - dependency-name: riverpod_annotation
        update-types: [version-update:semver-major]
      - dependency-name: sqlite3_flutter_libs
        versions: ['>=0.6.0']
      - dependency-name: '*'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    target-branch: feat/firebase-backend
    schedule: { interval: monthly }
