# SEC-REVIEW-003 F-09: known-vulnerable dependencies are found by a bot, not by a review months
# later. Security updates open at once; version updates weekly, grouped so they do not drown
# the queue. The remediation windows (critical 7 days, high 30) are in
# docs/security/security-checklist.md §Dependencies.
#
# Dependabot reads this file from the default branch only, which on GitHub is now
# feat/firebase-backend; `target-branch` keeps it there if the default changes back to main.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    target-branch: feat/firebase-backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    # @types/node follows the runtime (engines 22.x), not the newest Node: a major bump would type
    # APIs that Vercel's Node 22 does not have. Raise it by hand with the engines field.
    ignore:
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /firebase
    target-branch: feat/firebase-backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: pub
    directory: /mobile
    target-branch: feat/firebase-backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    target-branch: feat/firebase-backend
    schedule: { interval: monthly }
